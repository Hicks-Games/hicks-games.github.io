<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dad's Games — tests</title>
<style>
  body {
    margin: 0; padding: 20px;
    background: #14181d; color: #dfe6ec;
    font: 15px/1.6 ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #8a97a3; margin-bottom: 20px; font-size: 13px; }
  #banner {
    padding: 14px 18px; border-radius: 8px; margin-bottom: 20px;
    font-size: 18px; font-weight: 700;
  }
  .running { background: #2d3742; color: #dfe6ec; }
  .allpass { background: #14532d; color: #b7f7cf; }
  .anyfail { background: #5c1a1a; color: #ffd0d0; }
  h2 { font-size: 15px; margin: 22px 0 6px; color: #9fb4c7; }
  .case { padding: 2px 0 2px 22px; text-indent: -22px; }
  .pass::before { content: "PASS  "; color: #4ade80; }
  .fail::before { content: "FAIL  "; color: #f87171; }
  .why { color: #f87171; padding-left: 22px; }
  .note { color: #7dd3fc; padding-left: 22px; font-size: 13px; }
</style>
</head>
<body>
<h1>Dad's Games — test harness</h1>
<div class="sub">
  Every suite must be green before any deploy. This page is the whole test
  framework; there is nothing to install.
</div>
<div id="banner" class="running">running…</div>
<div id="out"></div>

<script src="../shared/state.js"></script>
<script src="../shared/guard.js"></script>
<script src="../shared/shell.js"></script>
<script src="../water-sort/rules.js"></script>
<script src="../water-sort/solver.js"></script>
<script src="../water-sort/generator.js"></script>
<script>
(function () {
  'use strict';

  var out = document.getElementById('out');
  var banner = document.getElementById('banner');
  var passed = 0, failed = 0;
  var queue = [];

  function suite(name, fn) { queue.push({ name: name, fn: fn }); }

  function assert(cond, msg) {
    if (!cond) throw new Error(msg || 'assertion failed');
  }
  function eq(actual, expected, msg) {
    var a = JSON.stringify(actual), b = JSON.stringify(expected);
    if (a !== b) throw new Error((msg || 'not equal') + ' — got ' + a + ', wanted ' + b);
  }

  function heading(name) {
    var h = document.createElement('h2');
    h.textContent = name;
    out.appendChild(h);
  }

  /* Informational output — timings and sizes. Not a pass or a fail, but the
   * numbers that say whether the difficulty caps are still honest. */
  function note(text) {
    var line = document.createElement('div');
    line.className = 'note';
    line.textContent = text;
    out.appendChild(line);
  }

  function report(desc, err) {
    var line = document.createElement('div');
    line.className = 'case ' + (err ? 'fail' : 'pass');
    line.textContent = desc;
    out.appendChild(line);
    if (err) {
      failed++;
      var why = document.createElement('div');
      why.className = 'why';
      why.textContent = err.message;
      out.appendChild(why);
    } else {
      passed++;
    }
  }

  // A test body may return a promise; the runner waits for it either way.
  function check(desc, fn) {
    var result;
    try {
      result = fn();
    } catch (err) {
      report(desc, err);
      return Promise.resolve();
    }
    if (result && typeof result.then === 'function') {
      return result.then(
        function () { report(desc, null); },
        function (err) { report(desc, err); }
      );
    }
    report(desc, null);
    return Promise.resolve();
  }

  // ---------------------------------------------------------------- state

  var G = '__test__';
  var KEY = 'portal.' + G + '.save';

  suite('state.js — saving and resuming', function () {
    return check('storage is available in this browser', function () {
      assert(Portal.state.available, 'localStorage unavailable — later results are meaningless');
    })
    .then(function () {
      return check('a saved game comes back exactly as stored', function () {
        var puzzle = { vials: [[1, 2], [2, 1]], colors: 2 };
        var moves = [{ from: 0, to: 1 }, { from: 1, to: 0 }];
        Portal.state.save(G, puzzle, moves);
        var got = Portal.state.load(G);
        eq(got.puzzle, puzzle, 'puzzle changed in the round trip');
        eq(got.moves, moves, 'moves changed in the round trip');
      });
    })
    .then(function () {
      return check('no save yet means a fresh puzzle, not an error', function () {
        Portal.state.clear(G);
        eq(Portal.state.load(G), null);
      });
    })
    .then(function () {
      return check('a save with no moves yet is still resumable', function () {
        Portal.state.save(G, { vials: [] }, []);
        var got = Portal.state.load(G);
        assert(got !== null, 'a freshly started puzzle should resume');
        eq(got.moves, []);
      });
    })
    .then(function () {
      return check('corrupted save gives a fresh puzzle and is never deleted', function () {
        localStorage.setItem(KEY, '{ this is not json');
        eq(Portal.state.load(G), null, 'should refuse to load');
        assert(localStorage.getItem(KEY) !== null,
          'the corrupt record was deleted — it must be left alone for rescue');
      });
    })
    .then(function () {
      return check('a save from a newer version is left untouched', function () {
        localStorage.setItem(KEY, JSON.stringify({
          v: Portal.state.SCHEMA + 5, puzzle: { x: 1 }, moves: []
        }));
        eq(Portal.state.load(G), null, 'should not try to read a future format');
        assert(localStorage.getItem(KEY) !== null, 'a future save must never be eaten');
      });
    })
    .then(function () {
      return check('a record missing its moves list is rejected, not half-loaded', function () {
        localStorage.setItem(KEY, JSON.stringify({ v: Portal.state.SCHEMA, puzzle: { x: 1 } }));
        eq(Portal.state.load(G), null);
      });
    })
    .then(function () {
      return check('clearing one game leaves other games alone', function () {
        Portal.state.save(G, { a: 1 }, []);
        Portal.state.save(G + '2', { b: 2 }, []);
        Portal.state.clear(G);
        eq(Portal.state.load(G), null);
        assert(Portal.state.load(G + '2') !== null, 'clear() hit the wrong game');
        Portal.state.clear(G + '2');
      });
    })
    .then(function () {
      return check('every key written lives under the portal namespace', function () {
        Portal.state.save(G, { a: 1 }, []);
        Portal.state.settings({ difficulty: 'easy' });
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          assert(k.indexOf('portal.') === 0,
            'found an un-namespaced key: ' + k);
        }
        Portal.state.clear(G);
      });
    })
    .then(function () {
      return check('settings survive a round trip', function () {
        Portal.state.settings({ difficulty: 'easy', textScale: 1.2 });
        eq(Portal.state.settings().difficulty, 'easy');
        eq(Portal.state.settings().textScale, 1.2);
      });
    });
  });

  // ---------------------------------------------------------------- guard

  suite('guard.js — crash journal', function () {
    var saved;
    return check('journal starts readable', function () {
      saved = localStorage.getItem('portal.errors');
      Portal.guard.clearJournal();
      eq(Portal.guard.journal(), []);
    })
    .then(function () {
      return check('the journal keeps only the most recent 20 errors', function () {
        var many = [];
        for (var i = 0; i < 30; i++) {
          many.push({ at: Date.now(), game: 'x', message: 'err' + i });
        }
        localStorage.setItem('portal.errors', JSON.stringify(many));
        // Recording one more must trim from the front, not the back. Uses the
        // journal half only — the full handler would paint a recovery screen
        // over these results. The full path is covered by the iframe below.
        Portal.guard._record({ at: Date.now(), game: 'x', message: 'newest' });
        var j = Portal.guard.journal();
        assert(j.length <= 20, 'journal grew past its cap: ' + j.length);
        eq(j[j.length - 1].message, 'newest', 'the newest error was dropped');
      });
    })
    .then(function () {
      return check('a corrupted journal reads as empty instead of throwing', function () {
        localStorage.setItem('portal.errors', 'not json at all');
        eq(Portal.guard.journal(), []);
      });
    })
    .then(function () {
      return check('journal restored after tests', function () {
        if (saved === null) Portal.guard.clearJournal();
        else localStorage.setItem('portal.errors', saved);
      });
    });
  });

  suite('guard.js — a real uncaught error', function () {
    return check('a crashing page shows the recovery screen and journals the error',
      function () {
        var before = Portal.guard.journal().length;
        var frame = document.createElement('iframe');
        frame.style.cssText = 'width:320px;height:200px;border:1px solid #2d3742;';
        document.body.appendChild(frame);
        frame.src = 'fixture-crash.html';

        return new Promise(function (resolve, reject) {
          setTimeout(function () {
            try {
              var doc = frame.contentDocument;
              var btn = doc.querySelector('[role="alertdialog"] button');
              assert(btn, 'no recovery screen appeared on a page that threw');
              assert(/games/i.test(btn.textContent),
                'recovery button should offer a way back to the games');

              var entries = Portal.guard.journal();
              assert(entries.length > before, 'the crash was not written to the journal');
              var last = entries[entries.length - 1];
              eq(last.game, '__testcrash__', 'the journal recorded the wrong game');
              assert(last.message, 'journal entry has no message to debug from');

              frame.remove();
              resolve();
            } catch (err) {
              frame.remove();
              reject(err);
            }
          }, 600);
        });
      });
  });

  // ----------------------------------------------------- water sort rules

  var WR = Portal.watersort.rules;

  suite('water sort — the rules', function () {
    return check('the pourable run is the matching colours on top', function () {
      eq(WR.topRun([]), 0);
      eq(WR.topRun([1]), 1);
      eq(WR.topRun([2, 1, 1]), 2);
      eq(WR.topRun([1, 1, 1, 1]), 4);
      eq(WR.topRun([1, 1, 2]), 1);
    })
    .then(function () {
      return check('you may pour onto an empty vial or a matching colour only', function () {
        var board = [[1, 1], [1], [2], []];
        assert(WR.canPour(board, 0, 1, 4), 'matching colours should pour');
        assert(!WR.canPour(board, 0, 2, 4), 'different colours must not pour');
        assert(WR.canPour(board, 0, 3, 4), 'anything may start an empty vial');
        assert(!WR.canPour(board, 3, 0, 4), 'an empty vial has nothing to pour');
        assert(!WR.canPour(board, 0, 0, 4), 'a vial cannot pour into itself');
      });
    })
    .then(function () {
      return check('a full vial cannot be poured into', function () {
        var board = [[1], [1, 1, 1, 1]];
        assert(!WR.canPour(board, 0, 1, 4));
      });
    })
    .then(function () {
      return check('a pour moves as much of the run as fits, and no more', function () {
        // three units want to move, but only two will fit
        eq(WR.pourAmount([[1, 1, 1], [1, 1]], 0, 1, 4), 2);
        eq(WR.pourAmount([[2, 1, 1], []], 0, 1, 4), 2);
        eq(WR.pourAmount([[2, 1, 1], [1]], 0, 1, 4), 2);
      });
    })
    .then(function () {
      return check('pouring produces a new board and leaves the old one untouched', function () {
        var before = [[2, 1, 1], []];
        var after = WR.pour(before, 0, 1, 4);
        eq(before, [[2, 1, 1], []], 'the original board was mutated');
        eq(after, [[2], [1, 1]]);
      });
    })
    .then(function () {
      return check('an illegal pour returns nothing rather than a broken board', function () {
        eq(WR.pour([[1], [2]], 0, 1, 4), null);
      });
    })
    .then(function () {
      return check('a puzzle is only won when every colour is fully gathered', function () {
        assert(WR.isSolved([[1, 1, 1, 1], [2, 2, 2, 2], []], 4), 'this is a win');
        assert(!WR.isSolved([[1, 1], [1, 1], []], 4),
          'a colour split across two vials is not a win');
        assert(!WR.isSolved([[1, 1, 2, 2], []], 4), 'mixed vials are not a win');
        assert(WR.isSolved([[], []], 4), 'an empty board is trivially won');
      });
    })
    .then(function () {
      return check('replaying a move list rebuilds the position exactly', function () {
        var start = [[2, 1, 1], [], [2]];
        var moves = [{ from: 0, to: 1 }, { from: 0, to: 2 }];
        eq(WR.replay(start, moves, 4), [[], [1, 1], [2, 2]]);
        eq(WR.replay(start, [], 4), start, 'no moves means the starting board');
      });
    })
    .then(function () {
      return check('a move list that does not fit the board is refused, not guessed at', function () {
        eq(WR.replay([[1], [2]], [{ from: 0, to: 1 }], 4), null);
      });
    });
  });

  // ---------------------------------------------------------- water sort solver

  var WS = Portal.watersort.solver;

  suite('water sort — the solver', function () {
    return check('it finds the route through a simple position', function () {
      var board = [[1, 1, 1], [1], [2, 2, 2, 2], []];
      var result = WS.solve(board, 4);
      assert(result.solved, 'a solvable board was reported unsolvable');
      var end = WR.replay(board, result.moves, 4);
      assert(end && WR.isSolved(end, 4), 'the solution it returned does not actually win');
    })
    .then(function () {
      return check('an already-finished board needs no moves', function () {
        var result = WS.solve([[1, 1, 1, 1], []], 4);
        assert(result.solved);
        eq(result.moves, []);
      });
    })
    .then(function () {
      return check('a genuinely impossible board is proven impossible, not guessed', function () {
        // Tops differ and there is nowhere to put anything: no legal move exists.
        var result = WS.solve([[0, 1, 0, 1], [1, 0, 1, 0]], 4);
        assert(!result.solved, 'an unsolvable board was reported solvable');
        eq(result.reason, 'exhausted',
          'should be proven by exhausting the search, not by running out of budget');
      });
    })
    .then(function () {
      return check('the budget is honoured and reported honestly', function () {
        var puzzle = Portal.watersort.generator.generate({ difficulty: 'hard', seed: 7 });
        var result = WS.solve(puzzle.board, 4, 5); // absurdly small budget
        assert(!result.solved, 'a 5-position budget should not solve a hard board');
        eq(result.reason, 'budget', 'running out of time must not be reported as impossible');
      });
    });
  });

  // ------------------------------------------------------- water sort generator

  var WG = Portal.watersort.generator;

  suite('water sort — every puzzle is finishable', function () {
    return check('a generated puzzle is never already solved', function () {
      for (var i = 0; i < 50; i++) {
        var p = WG.generate({ difficulty: 'easy', seed: 1000 + i });
        assert(!WR.isSolved(p.board, p.capacity), 'handed out an already-finished puzzle');
      }
    })
    .then(function () {
      return check('colour counts are always exact — nothing lost or duplicated', function () {
        for (var i = 0; i < 50; i++) {
          var p = WG.generate({ difficulty: 'medium', seed: 2000 + i });
          var counts = {};
          p.board.forEach(function (v) {
            v.forEach(function (c) { counts[c] = (counts[c] || 0) + 1; });
          });
          eq(Object.keys(counts).length, p.colours, 'wrong number of colours');
          for (var c = 0; c < p.colours; c++) {
            eq(counts[c], p.capacity, 'colour ' + c + ' has the wrong number of units');
          }
          eq(p.board.length, p.colours + p.empties, 'wrong number of vials');
        }
      });
    })
    .then(function () {
      return check('a puzzle opens the way the real game opens: full vials, two empty',
        function () {
          // Dad has played this game for years. A board that starts with
          // half-filled vials is subtly not the game he knows.
          ['gentle', 'easy', 'medium', 'hard'].forEach(function (diff) {
            for (var i = 0; i < 40; i++) {
              var p = WG.generate({ difficulty: diff, seed: 3000 + i });
              var emptyCount = 0;
              p.board.forEach(function (v) {
                if (v.length === 0) { emptyCount++; return; }
                eq(v.length, p.capacity,
                  diff + ': a starting vial was only part full (seed ' + p.seed + ')');
              });
              eq(emptyCount, p.empties,
                diff + ': wrong number of empty vials to work with');
            }
          });
        });
    })
    .then(function () {
      return check('a puzzle is never so nearly sorted that it is not a puzzle', function () {
        for (var i = 0; i < 200; i++) {
          var p = WG.generate({ difficulty: 'easy', seed: 8000 + i });
          assert(p.solution.length >= p.colours,
            'dealt a board that solves in ' + p.solution.length + ' moves (seed ' + p.seed + ')');
        }
      });
    })
    .then(function () {
      return check('mystery puzzles are dealt and verified exactly like the rest', function () {
        // Hiding the colours changes what he can see, never whether the puzzle
        // can be finished.
        for (var i = 0; i < 200; i++) {
          var p = WG.generate({ difficulty: 'mystery', seed: 9000 + i });
          assert(p.hidden, 'mystery puzzle is not marked hidden');
          var end = WR.replay(p.board, p.solution, p.capacity);
          assert(end && WR.isSolved(end, p.capacity),
            'mystery puzzle not solvable by its own solution (seed ' + p.seed + ')');
        }
      });
    })
    .then(function () {
      return check('what he has seen is remembered from the move list alone', function () {
        var p = WG.generate({ difficulty: 'mystery', seed: 123 });
        var fresh = WR.replayRevealing(p.board, [], p.capacity);
        // At the start: the top of each filled vial, and nothing else.
        var visible = 0;
        fresh.ids.forEach(function (v) {
          v.forEach(function (id) { if (fresh.seen[id]) visible++; });
        });
        eq(visible, p.colours, 'should start with exactly one visible layer per filled vial');

        // Replaying the whole solution must reveal everything, and must give
        // the same answer every time it is recomputed — this is what makes it
        // survive closing the app.
        var done = WR.replayRevealing(p.board, p.solution, p.capacity);
        var again = WR.replayRevealing(p.board, p.solution, p.capacity);
        eq(Object.keys(done.seen).length, Object.keys(again.seen).length,
          'recomputing what he has seen gave a different answer');
        assert(WR.isSolved(done.board, p.capacity), 'tracked replay lost the game state');
      });
    })
    .then(function () {
      return check('the same seed always produces the same puzzle', function () {
        var a = WG.generate({ difficulty: 'easy', seed: 4242 });
        var b = WG.generate({ difficulty: 'easy', seed: 4242 });
        eq(a.board, b.board, 'seeded generation is not reproducible');
      });
    })
    .then(function () {
      return check('1000 easy puzzles: every stored solution genuinely wins', function () {
        var t0 = performance.now();
        var worst = 0, total = 0;
        for (var i = 0; i < 1000; i++) {
          var p = WG.generate({ difficulty: 'easy', seed: i + 1 });
          var end = WR.replay(p.board, p.solution, p.capacity);
          assert(end !== null, 'stored solution contains an illegal move (seed ' + p.seed + ')');
          assert(WR.isSolved(end, p.capacity),
            'stored solution does not finish the puzzle (seed ' + p.seed + ')');
          total += p.solution.length;
          if (p.solution.length > worst) worst = p.solution.length;
        }
        var ms = performance.now() - t0;
        note('1000 easy puzzles in ' + Math.round(ms) + 'ms (' +
          (ms / 1000).toFixed(1) + 'ms each), ' +
          Math.round(total / 1000) + ' moves average, ' + worst + ' longest');
        assert(ms / 1000 < 250,
          'generation averaged over the 250ms budget — difficulty caps need revisiting');
      });
    })
    .then(function () {
      return check('300 gentle puzzles: every stored solution genuinely wins', function () {
        for (var i = 0; i < 300; i++) {
          var p = WG.generate({ difficulty: 'gentle', seed: i + 50000 });
          var end = WR.replay(p.board, p.solution, p.capacity);
          assert(end && WR.isSolved(end, p.capacity),
            'gentle puzzle not solvable by its own solution (seed ' + p.seed + ')');
        }
      });
    })
    .then(function () {
      return check('300 medium puzzles: every stored solution genuinely wins', function () {
        var t0 = performance.now();
        for (var i = 0; i < 300; i++) {
          var p = WG.generate({ difficulty: 'medium', seed: i + 60000 });
          var end = WR.replay(p.board, p.solution, p.capacity);
          assert(end && WR.isSolved(end, p.capacity),
            'medium puzzle not solvable by its own solution (seed ' + p.seed + ')');
        }
        var ms = performance.now() - t0;
        note('300 medium puzzles in ' + Math.round(ms) + 'ms (' +
          (ms / 300).toFixed(1) + 'ms each)');
      });
    })
    .then(function () {
      return check('100 hard puzzles: every stored solution genuinely wins', function () {
        var t0 = performance.now();
        for (var i = 0; i < 100; i++) {
          var p = WG.generate({ difficulty: 'hard', seed: i + 70000 });
          var end = WR.replay(p.board, p.solution, p.capacity);
          assert(end && WR.isSolved(end, p.capacity),
            'hard puzzle not solvable by its own solution (seed ' + p.seed + ')');
        }
        var ms = performance.now() - t0;
        note('100 hard puzzles in ' + Math.round(ms) + 'ms (' +
          (ms / 100).toFixed(1) + 'ms each)');
      });
    });
  });

  // ------------------------------------------------- water sort, end to end

  /* Drives the real game page in an iframe: the real DOM, the real tap
   * handler, the real save format. Anything that only works because a test
   * called a convenient internal function gets caught here. */
  function withGamePage(fn) {
    var frame = document.createElement('iframe');
    frame.style.cssText = 'width:360px;height:760px;border:1px solid #2d3742;';
    document.body.appendChild(frame);
    frame.src = '../water-sort/';

    return new Promise(function (resolve, reject) {
      frame.addEventListener('load', function () {
        setTimeout(function () {
          try {
            var result = fn(frame.contentWindow, frame.contentDocument);
            frame.remove();
            resolve(result);
          } catch (err) {
            frame.remove();
            reject(err);
          }
        }, 150);
      });
    });
  }

  suite('water sort — playing the real game screen', function () {
    var savedGame;
    return check('set aside any real saved game', function () {
      savedGame = localStorage.getItem('portal.water-sort.save');
      localStorage.removeItem('portal.water-sort.save');
    })
    .then(function () {
      return check('the board opens with a vial for every colour and two spare', function () {
        return withGamePage(function (win, doc) {
          var g = win.Portal.watersort.game._state();
          eq(doc.querySelectorAll('.vial-tap').length, g.board.length,
            'a vial is missing from the screen');
          eq(g.board.length, g.puzzle.colours + g.puzzle.empties);
          assert(/^Level \d+/.test(doc.getElementById('level').textContent),
            'the level is not on screen: "' + doc.getElementById('level').textContent + '"');
        });
      });
    })
    .then(function () {
      return check('mystery puzzles show only the liquid he has actually seen', function () {
        var kept = localStorage.getItem('portal.settings');
        var s = Portal.state.settings();
        s.watersortDifficulty = 'mystery';
        Portal.state.settings(s);
        localStorage.removeItem('portal.water-sort.save');

        return withGamePage(function (win, doc) {
          var game = win.Portal.watersort.game;
          var g = game._state();
          assert(g.puzzle.hidden, 'mystery did not produce a hidden puzzle');

          function shown(doc2) {
            return [].map.call(doc2.querySelectorAll('.vial-tap'), function (t) {
              return [].map.call(t.querySelectorAll('.layer'), function (l) {
                return l.classList.contains('hidden-layer') ? '?' : 'C';
              }).join('');
            });
          }

          // Every filled vial starts with exactly its top layer showing.
          shown(doc).forEach(function (v) {
            if (!v.length) return;
            eq(v, '???C'.slice(4 - v.length), 'a vial did not start with only its top showing');
          });

          // Pouring reveals what moved and what it uncovered.
          var move = win.Portal.watersort.rules.moves(g.board, g.puzzle.capacity)[0];
          game._tap(move.from);
          game._tap(move.to);
          var after = shown(doc);
          assert(after[move.to].indexOf('C') > -1, 'poured liquid is still hidden');
          assert(after[move.to].indexOf('?') === -1,
            'liquid he just poured himself should not be a mystery');
        }).then(function (r) {
          if (kept === null) localStorage.removeItem('portal.settings');
          else localStorage.setItem('portal.settings', kept);
          localStorage.removeItem('portal.water-sort.save');
          return r;
        });
      });
    })
    .then(function () {
      return check('finishing a puzzle moves him up a level', function () {
        var kept = Portal.state.progress('water-sort');
        Portal.state.progress('water-sort', 40);
        localStorage.removeItem('portal.water-sort.save');
        return withGamePage(function (win, doc) {
          var game = win.Portal.watersort.game;
          eq(doc.getElementById('level').textContent.indexOf('Level 41'), 0,
            'the level shown is not the next one up');
          game._state().puzzle.solution.forEach(function (m) {
            game._tap(m.from);
            game._tap(m.to);
          });
          eq(win.Portal.state.progress('water-sort'), 41, 'the level did not go up');
        }).then(function (r) {
          Portal.state.progress('water-sort', kept);
          localStorage.removeItem('portal.water-sort.save');
          return r;
        });
      });
    })
    .then(function () {
      return check('the three ways out are always on screen, in order', function () {
        return withGamePage(function (win, doc) {
          var labels = [].map.call(doc.querySelectorAll('.controls .btn'), function (b) {
            return b.textContent.trim();
          });
          eq(labels, ['Undo', 'Start Over', 'Home']);
        });
      });
    })
    .then(function () {
      return check('tapping a vial then another pours, and undo puts it back', function () {
        return withGamePage(function (win) {
          var game = win.Portal.watersort.game;
          var R2 = win.Portal.watersort.rules;
          var start = game._state();

          var move = R2.moves(start.board, start.puzzle.capacity)[0];
          game._tap(move.from);
          eq(game._state().selected, move.from, 'the first tap did not pick up the vial');

          game._tap(move.to);
          var poured = game._state();
          eq(poured.moves.length, 1, 'the second tap did not pour');
          eq(poured.selected, null, 'the vial stayed held after pouring');
          assert(JSON.stringify(poured.board) !== JSON.stringify(start.board),
            'the board did not change');

          game._undo();
          eq(game._state().board, start.board, 'undo did not restore the board');
          eq(game._state().moves.length, 0);
        });
      });
    })
    .then(function () {
      return check('undo with nothing to undo does nothing at all', function () {
        return withGamePage(function (win, doc) {
          var game = win.Portal.watersort.game;
          var before = game._state();
          game._undo();
          game._undo();
          eq(game._state().board, before.board, 'undo changed the board from a clean start');
          eq(doc.querySelectorAll('.celebrate').length, 0, 'something appeared on screen');
        });
      });
    })
    .then(function () {
      return check('start over returns to the opening board, however far in he is', function () {
        return withGamePage(function (win) {
          var game = win.Portal.watersort.game;
          var R2 = win.Portal.watersort.rules;
          var start = game._state();
          start.puzzle.solution.slice(0, 4).forEach(function (m) {
            game._tap(m.from);
            game._tap(m.to);
          });
          assert(game._state().moves.length > 0, 'no moves were made to undo');
          game._startOver();
          eq(game._state().board, start.board);
          eq(game._state().moves.length, 0);
        });
      });
    })
    .then(function () {
      return check('playing the solution by tapping wins, and the win is celebrated',
        function () {
          return withGamePage(function (win, doc) {
            var game = win.Portal.watersort.game;
            var R2 = win.Portal.watersort.rules;
            var puzzle = game._state().puzzle;

            puzzle.solution.forEach(function (m) {
              game._tap(m.from);
              game._tap(m.to);
            });

            var end = game._state();
            eq(end.moves.length, puzzle.solution.length,
              'tapping the solution did not record every move');
            assert(R2.isSolved(end.board, puzzle.capacity),
              'tapping the solution did not finish the puzzle');

            var party = doc.querySelector('.celebrate');
            assert(party, 'winning was not celebrated');
            var buttons = [].map.call(party.querySelectorAll('button'), function (b) {
              return b.textContent.trim();
            });
            eq(buttons, ['Play Again', 'Home'], 'the celebration offers the wrong way on');
          });
        });
    })
    .then(function () {
      return check('nothing tappable is ever smaller than a thumb, at any difficulty',
        function () {
          // The iframe is his phone's width. 64px is the floor for every
          // tappable thing in the portal; a ten-vial puzzle packed five across
          // silently breaks it.
          var kept = localStorage.getItem('portal.settings');
          var chain = Promise.resolve();
          ['gentle', 'easy', 'medium', 'hard'].forEach(function (diff) {
            chain = chain.then(function () {
              var s = Portal.state.settings();
              s.watersortDifficulty = diff;
              Portal.state.settings(s);
              localStorage.removeItem('portal.water-sort.save');
              return withGamePage(function (win, doc) {
                var taps = doc.querySelectorAll('.vial-tap');
                var controls = doc.querySelectorAll('.controls .btn');
                [].concat([].slice.call(taps), [].slice.call(controls))
                  .forEach(function (el) {
                    var box = el.getBoundingClientRect();
                    assert(box.width >= 64 && box.height >= 64,
                      diff + ': a control is only ' + Math.round(box.width) + 'x' +
                      Math.round(box.height) + 'px');
                  });
                assert(win.document.documentElement.scrollHeight <= win.innerHeight + 1,
                  diff + ': the board does not fit the screen without scrolling');
              });
            });
          });
          return chain.then(function () {
            if (kept === null) localStorage.removeItem('portal.settings');
            else localStorage.setItem('portal.settings', kept);
          });
        });
    })
    .then(function () {
      return check('every move is saved as it happens, so nothing is lost', function () {
        return withGamePage(function (win) {
          var game = win.Portal.watersort.game;
          var start = game._state();
          start.puzzle.solution.slice(0, 2).forEach(function (m) {
            game._tap(m.from);
            game._tap(m.to);
          });
          var live = game._state();
          var onDisk = JSON.parse(localStorage.getItem('portal.water-sort.save'));
          eq(onDisk.moves, live.moves, 'the saved moves do not match the game on screen');
          eq(onDisk.puzzle.seed, live.puzzle.seed, 'the saved puzzle is a different puzzle');
        });
      });
    })
    .then(function () {
      return check('restore any real saved game', function () {
        if (savedGame === null) localStorage.removeItem('portal.water-sort.save');
        else localStorage.setItem('portal.water-sort.save', savedGame);
      });
    });
  });

  // ---------------------------------------------------------------- run

  (function run(i) {
    if (i >= queue.length) {
      banner.className = failed ? 'anyfail' : 'allpass';
      banner.textContent = failed
        ? failed + ' FAILED, ' + passed + ' passed — do not deploy'
        : 'all ' + passed + ' checks passed';
      return;
    }
    heading(queue[i].name);
    Promise.resolve(queue[i].fn()).then(function () { run(i + 1); });
  })(0);
})();
</script>
</body>
</html>
