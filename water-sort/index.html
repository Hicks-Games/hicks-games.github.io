<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f4f1ea">
<title>Water Sort</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="game.css">
</head>
<body>

<div class="screen">
  <!-- The promise. It is on screen the whole time because the whole point is
       that he never has to wonder whether the puzzle is winnable. -->
  <div class="assurance">This puzzle can be solved &#10003;</div>

  <div class="stage">
    <div class="board" id="board"></div>
  </div>

  <!-- Always here. Always these three. Always in this order. -->
  <div class="controls">
    <button class="btn" id="undo" type="button">Undo</button>
    <button class="btn" id="restart" type="button">Start Over</button>
    <button class="btn" type="button" data-portal-home>Home</button>
  </div>
</div>

<script src="../shared/state.js"></script>
<script src="../shared/guard.js"></script>
<script src="../shared/shell.js"></script>
<script src="../shared/celebrate.js"></script>
<script src="rules.js"></script>
<script src="solver.js"></script>
<script src="generator.js"></script>
<script src="game.js"></script>
</body>
</html>
