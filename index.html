<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#1b3a5c">
<title>Dad's Games</title>
<style>
  :root { color-scheme: light; }
  html, body {
    margin: 0;
    height: 100%;
    background: #f4f1ea;
    color: #22303c;
    font: 500 20px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  h1 { font-size: 40px; margin: 0 0 8px; letter-spacing: -0.5px; }
  p { font-size: 22px; margin: 6px 0; max-width: 22em; }
  .muted { color: #6b7a87; font-size: 17px; margin-top: 28px; }
  .stamp {
    margin-top: 18px;
    font: 500 15px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace;
    color: #8a97a3;
  }
</style>
</head>
<body>
  <h1>Dad's Games</h1>
  <p>The portal is set up and deploying correctly.</p>
  <p class="muted">Games are being built. Water sort is first.</p>
  <p class="stamp" id="stamp"></p>
  <script>
    // Proves you are looking at the deployed copy, not a cached older one.
    document.getElementById('stamp').textContent =
      'setup verified · ' + new Date().toLocaleString();
  </script>
</body>
</html>
