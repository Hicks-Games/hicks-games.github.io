<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f4f1ea">
<title>Dad's Games</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="screen">
  <h1 class="menu-title">Dad's Games</h1>
  <div class="menu-list" id="menu"></div>
</div>

<script src="shared/state.js"></script>
<script src="shared/guard.js"></script>
<script src="shared/shell.js"></script>
<script>
(function () {
  'use strict';

  /* The menu is this list. Adding a game later is one entry — the layout,
   * the sizing and the tap handling all follow from it, and a game that is
   * not finished simply isn't listed. A button that leads nowhere is worse
   * than no button at all. */
  var GAMES = [
    {
      id: 'water-sort',
      label: 'Water Sort',
      href: 'water-sort/',
      icon:
        '<svg viewBox="0 0 40 40" aria-hidden="true">' +
        '<path d="M13 4h14v22a7 7 0 0 1-14 0z" fill="#fff" stroke="#b3bec7" stroke-width="2.5"/>' +
        '<path d="M14.2 26a5.8 5.8 0 0 0 11.6 0v-3.5H14.2z" fill="#e69f00"/>' +
        '<rect x="14.2" y="16" width="11.6" height="6.5" fill="#56b4e9"/>' +
        '<rect x="14.2" y="9.5" width="11.6" height="6.5" fill="#009e73"/>' +
        '<path d="M13 4h14v22a7 7 0 0 1-14 0z" fill="none" stroke="#b3bec7" stroke-width="2.5"/>' +
        '</svg>'
    },
    {
      id: 'untangle',
      label: 'Untangle',
      href: 'untangle/',
      icon:
        '<svg viewBox="0 0 40 40" aria-hidden="true">' +
        '<g stroke="#9fb0bd" stroke-width="2.5" stroke-linecap="round">' +
        '<path d="M9 10L31 30"/><path d="M31 10L9 30"/><path d="M9 10h22"/>' +
        '</g>' +
        '<g fill="#1b3a5c">' +
        '<circle cx="9" cy="10" r="4.5"/><circle cx="31" cy="10" r="4.5"/>' +
        '<circle cx="9" cy="30" r="4.5"/><circle cx="31" cy="30" r="4.5"/>' +
        '</g>' +
        '</svg>'
    },
    {
      id: 'sudoku',
      label: 'Sudoku',
      href: 'sudoku/',
      icon:
        '<svg viewBox="0 0 40 40" aria-hidden="true">' +
        '<rect x="5" y="5" width="30" height="30" rx="2" fill="#fff" stroke="#22303c" stroke-width="2.5"/>' +
        '<g stroke="#b3bec7" stroke-width="1.5">' +
        '<path d="M15 5v30M25 5v30M5 15h30M5 25h30"/>' +
        '</g>' +
        '<g fill="#1b3a5c" font-family="system-ui,sans-serif" font-size="9" font-weight="700" text-anchor="middle">' +
        '<text x="10" y="13.5">3</text><text x="30" y="23.5">7</text><text x="20" y="33.5">1</text>' +
        '</g>' +
        '</svg>'
    }
  ];

  Portal.shell.start({ game: 'menu', isMenu: true });

  var list = document.getElementById('menu');
  GAMES.forEach(function (game) {
    var button = document.createElement('button');
    button.className = 'btn game-button';
    button.type = 'button';
    button.innerHTML = game.icon + '<span>' + game.label + '</span>';
    // Stated outright, because the sudoku icon has numbers drawn in it and
    // they would otherwise be read out as part of the name.
    button.setAttribute('aria-label', game.label);
    button.addEventListener('click', function () {
      window.location.href = game.href;
    });
    list.appendChild(button);
  });
})();
</script>
</body>
</html>
